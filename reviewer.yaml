version: 1

target:
  owner: microsoft
  repo: vscode

poll:
  maxPerRun: 5
  maxPerDay: 25
  quietPeriodMinutes: 5
  scanWindowHours: 168
  maxPendingAgeHours: 24

automation:
  enabled: false
  skipLabels:
    - performance-reviewer:skip

publication:
  mode: approval

review:
  model: gpt-5.6-sol
  reasoningEffort: high
  minConfidence: 0.85
  maxFindings: 10
  focuses:
    - performance-review

state:
  branch: reviewer-state
  path: .rob-reviewer/state.json
