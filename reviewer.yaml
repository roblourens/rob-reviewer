version: 1

target:
  owner: microsoft
  repo: vscode

poll:
  maxPerRun: 5
  maxPerDay: 25
  scanWindowHours: 168
  maxPendingAgeHours: 24

automation:
  enabled: true
  skipLabels:
    - performance-reviewer:skip

publication:
  mode: approval
  reviewerLogin: roblourens
  optIn:
    owner: microsoft
    repo: vscode-internalbacklog
    branch: main
    path: .github/performance-reviewer.json

learning:
  enabled: true
  maxCasesPerRun: 1

review:
  model: gpt-6.1-sol
  reasoningEffort: high
  minConfidence: 0.85
  maxFindings: 10
  focuses:
    - performance-review

state:
  branch: reviewer-state
  path: .rob-reviewer/state.json
