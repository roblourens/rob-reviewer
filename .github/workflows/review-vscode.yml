name: Review VS Code pull requests

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for a one-off review; leave empty to run the poller
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vscode-pr-reviewer
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROB_REVIEWER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/rob-reviewer/repositories
          key: vscode-repository-cache-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: |
            vscode-repository-cache-${{ runner.os }}-v1-
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: go mod download
      - run: go tool bundler
        working-directory: cmd/rob-reviewer
      - name: Poll for new pull requests
        if: ${{ github.event_name == 'schedule' || inputs.pr_number == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: go run ./cmd/rob-reviewer poll --output-dir review-results
      - name: Review one pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: go run ./cmd/rob-reviewer review --pr "$PR_NUMBER" --output-dir review-results
      - name: Upload review reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-review-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-results/
          if-no-files-found: ignore
      - name: Ensure reviewer history branch
        if: ${{ always() && hashFiles('review-results/**') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/reviewer-state" >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/heads/reviewer-state' \
              -f sha="${GITHUB_SHA}"
          fi
      - name: Check out reviewer history
        if: ${{ always() && hashFiles('review-results/**') != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: reviewer-state
          path: reviewer-history
          token: ${{ github.token }}
      - name: Archive reviewer run
        if: ${{ always() && hashFiles('review-results/**') != '' }}
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          completed_at="$(jq -r '.metadata.completedAt' review-results/run.json)"
          archive_date="$(date -u -d "$completed_at" +'%Y/%m/%d')"
          destination=".rob-reviewer/runs/${archive_date}/${RUN_ID}-${RUN_ATTEMPT}"
          if [[ -e "reviewer-history/$destination" ]]; then
            echo "Reviewer run archive already exists: $destination" >&2
            exit 1
          fi
          mkdir -p "reviewer-history/$destination"
          cp -R review-results/. "reviewer-history/$destination/"
          cd reviewer-history
          ledger='.rob-reviewer/regression-cases.json'
          current="$destination/regression-cases.json"
          if [[ ! -f "$ledger" ]]; then
            printf '{"version":1,"cases":[],"unresolved":[]}\n' > "$ledger"
          fi
          jq -s '{
            version: 1,
            cases: ([.[].cases[]?] | sort_by(.id) | group_by(.id) | map(last) | sort_by(.createdAt, .id)),
            unresolved: ([.[].unresolved[]?] | unique_by([.fixer.headSha, .introducingCommit, .mechanismFamily]))
          }' "$ledger" "$current" > "${ledger}.tmp"
          mv "${ledger}.tmp" "$ledger"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .rob-reviewer/runs .rob-reviewer/regression-cases.json
          git commit \
            -m "Archive reviewer run ${RUN_ID} attempt ${RUN_ATTEMPT} (Written by Copilot)" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:reviewer-state
