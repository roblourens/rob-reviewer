name: Review VS Code pull requests

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for a one-off review; leave empty to run the poller
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vscode-pr-reviewer
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROB_REVIEWER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/rob-reviewer/repositories
          key: vscode-repository-cache-${{ runner.os }}-v1-${{ github.run_id }}
          restore-keys: |
            vscode-repository-cache-${{ runner.os }}-v1-
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: go mod download
      - run: go tool bundler
        working-directory: cmd/rob-reviewer
      - name: Poll for new pull requests
        if: ${{ github.event_name == 'schedule' || inputs.pr_number == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: go run ./cmd/rob-reviewer poll --output-dir review-results
      - name: Review one pull request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_GITHUB_TOKEN: ${{ secrets.REVIEW_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: go run ./cmd/rob-reviewer review --pr "$PR_NUMBER" --output-dir review-results
      - name: Upload review reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-review-reports-${{ github.run_id }}
          path: review-results/
          if-no-files-found: ignore
