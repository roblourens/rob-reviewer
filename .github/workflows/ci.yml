name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go tool bundler
        working-directory: cmd/rob-reviewer
      - run: go build ./cmd/rob-reviewer
