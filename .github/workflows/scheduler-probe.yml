name: Scheduler diagnostic probe

on:
  schedule:
    - cron: "2-59/5 * * * *"

permissions: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record automatic event delivery
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          printf 'event=%s schedule=%s delivered_at=%s\n' "$EVENT_NAME" "$SCHEDULE" "$(date -u +%FT%TZ)"
